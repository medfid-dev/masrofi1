name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: setup
        run: |
          flutter create --org com.example --project-name masrofi --platforms=android app
          cd app
          flutter pub add shared_preferences flutter_local_notifications:^18.0.1 timezone supabase_flutter geolocator geolocator_android
          rm -f lib/main.dart test/widget_test.dart
          cp -r ../lib/. lib/
          mkdir -p test && cp -r ../test/. test/
          python3 ../tool/patch_android.py .
      - name: tests
        run: cd app && flutter test
      - name: build
        run: cd app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: masrofi-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
